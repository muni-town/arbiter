[package]
name = "arbiter-server"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "arbiter-server"
path = "src/main.rs"

[lib]
name = "arbiter_server"
path = "src/lib.rs"

[dependencies]
arbiter-core = { path = "../arbiter-core" }
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
moka = { version = "0.12", features = ["future"] }
atproto-identity = "0.14.5"
atproto-oauth = "0.14.5"
atrium-xrpc-client = { version = "0.5.15", features = ["reqwest"], default-features = false }
atrium-xrpc = "0.12.4"
atrium-api = { version = "0.25.8", default-features = false, features = ["agent"] }
regorus = { version = "0.11.0", default-features = false, features = ["rvm", "arc", "std"] }
turso = "0.8.0-pre.2"
# CSPRNG for steward passwords.
rand = "0.9"
# base64 encoding for steward passwords (handlers.rs).
base64 = "0.22"
# base32 encoding for steward handle local labels (handlers.rs).
data-encoding = "2"
# --- Jetstream subscription (policy/service-record hot reload) ---
# Typed ATProto Jetstream consumer (WebSocket + parsing handled by the library).
atproto-jetstream = "0.14.5"