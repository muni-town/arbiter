[package]
name = "arbiter-core"
version = "0.1.0"
edition = "2024"

[features]
default = ["futures"]
futures = ["dep:async-lock"]

[dependencies]
regorus = { version = "0.11.0", default-features = false, features = ["rvm", "arc", "std"] }

serde_json = "1"
serde = { version = "1", features = ["derive"] }

anyhow = "1.0.104"

async-lock = { version = "3.4.2", optional = true }
atrium-xrpc = "0.12.4"
