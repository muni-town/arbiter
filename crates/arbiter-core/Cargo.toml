[package]
name = "arbiter-core"
version = "0.1.0"
edition = "2024"

[features]
default = ["futures"]
futures = ["dep:async-lock"]

[dependencies]
policy-core = { path = "../policy-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

async-lock = { version = "3.4.2", optional = true }
